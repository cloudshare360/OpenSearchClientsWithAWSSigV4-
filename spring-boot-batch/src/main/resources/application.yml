spring:
  application:
    name: spring-boot-batch
  datasource:
    url: jdbc:postgresql://localhost:5432/employeedb
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  batch:
    job:
      enabled: true
    jdbc:
      initialize-schema: always
      schema: classpath:schema.sql

server:
  port: 8081
  address: 0.0.0.0

aws:
  region: us-east-1
  credentials:
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    session-token: ${AWS_SESSION_TOKEN:}
  secrets-manager:
    enabled: true
    secret-name: opensearch/credentials
    refresh-interval: 300000
  opensearch:
    endpoint: http://opensearch-node:9200
    index: employees
    connection-timeout: 30s
    socket-timeout: 60s
    max-retries: 3
    retry-backoff: 1000

batch:
  chunk:
    size: 100
  schedule:
    enabled: true
    cron: "0 */5 * * * *"

logging:
  level:
    com.example.batch: DEBUG
    org.springframework.batch: DEBUG
    org.opensearch.client: DEBUG
    software.amazon.awssdk: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
