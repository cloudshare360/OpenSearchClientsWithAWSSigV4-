<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-search"></i> Employee Search
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Back to Search</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4" th:if="${employee}">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4>Employee Details</h4>
                        <div>
                            <a th:href="@{'/employees/' + ${employee.id} + '/edit'}" class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Employee ID:</strong>
                                <span th:text="${employee.id}">1</span>
                            </div>
                            <div class="col-md-6">
                                <strong>Status:</strong>
                                <span class="badge" 
                                      th:classappend="${employee.isActive} ? 'bg-success' : 'bg-danger'"
                                      th:text="${employee.isActive} ? 'Active' : 'Inactive'">
                                    Active
                                </span>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>First Name:</strong>
                                <span th:text="${employee.firstName}">John</span>
                            </div>
                            <div class="col-md-6">
                                <strong>Last Name:</strong>
                                <span th:text="${employee.lastName}">Doe</span>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-12">
                                <strong>Email:</strong>
                                <span th:text="${employee.email}">john@example.com</span>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Department:</strong>
                                <span th:text="${employee.department}">Engineering</span>
                            </div>
                            <div class="col-md-6">
                                <strong>Position:</strong>
                                <span th:text="${employee.position}">Software Engineer</span>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Salary:</strong>
                                <span th:text="${#numbers.formatDecimal(employee.salary, 1, 2)}">$0.00</span>
                            </div>
                            <div class="col-md-6">
                                <strong>Hire Date:</strong>
                                <span th:text="${employee.hireDate}">2024-01-01</span>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Created At:</strong>
                                <span th:text="${employee.createdAt}">2024-01-01</span>
                            </div>
                            <div class="col-md-6">
                                <strong>Updated At:</strong>
                                <span th:text="${employee.updatedAt}">2024-01-01</span>
                            </div>
                        </div>

                        <div class="mt-4">
                            <a href="/" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Back to List
                            </a>
                            <a th:href="@{'/employees/' + ${employee.id} + '/edit'}" class="btn btn-primary">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
