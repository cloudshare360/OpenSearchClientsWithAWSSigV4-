<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-search"></i> Employee Search
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Back to Search</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4 th:text="${employee.id != null} ? 'Edit Employee' : 'New Employee'">New Employee</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/employees}" th:object="${employee}" method="post" 
                              th:if="${employee.id == null}">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">First Name *</label>
                                    <input type="text" th:field="*{firstName}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Last Name *</label>
                                    <input type="text" th:field="*{lastName}" class="form-control" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Email *</label>
                                    <input type="email" th:field="*{email}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Department *</label>
                                    <select th:field="*{department}" class="form-select" required>
                                        <option value="">Select Department</option>
                                        <option value="Engineering">Engineering</option>
                                        <option value="Sales">Sales</option>
                                        <option value="Marketing">Marketing</option>
                                        <option value="HR">HR</option>
                                        <option value="Finance">Finance</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Position *</label>
                                    <input type="text" th:field="*{position}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Salary</label>
                                    <input type="number" th:field="*{salary}" class="form-control" step="0.01">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Hire Date *</label>
                                    <input type="date" th:field="*{hireDate}" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check"></i> Create Employee
                                    </button>
                                    <a href="/" class="btn btn-secondary">Cancel</a>
                                </div>
                            </div>
                        </form>

                        <form th:action="@{'/employees/' + ${employee.id}}" th:object="${employee}" method="post" 
                              th:unless="${employee.id == null}">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">First Name *</label>
                                    <input type="text" th:field="*{firstName}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Last Name *</label>
                                    <input type="text" th:field="*{lastName}" class="form-control" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Email *</label>
                                    <input type="email" th:field="*{email}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Department *</label>
                                    <select th:field="*{department}" class="form-select" required>
                                        <option value="">Select Department</option>
                                        <option value="Engineering">Engineering</option>
                                        <option value="Sales">Sales</option>
                                        <option value="Marketing">Marketing</option>
                                        <option value="HR">HR</option>
                                        <option value="Finance">Finance</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Position *</label>
                                    <input type="text" th:field="*{position}" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Salary</label>
                                    <input type="number" th:field="*{salary}" class="form-control" step="0.01">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Hire Date *</label>
                                    <input type="date" th:field="*{hireDate}" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-check"></i> Update Employee
                                    </button>
                                    <a href="/" class="btn btn-secondary">Cancel</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
